[package]
name = "excaliplot"
version.workspace = true
description = "High-level editable Excalidraw charts built on Plotters"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["excalidraw", "plotters", "chart", "drawing", "visualization"]
categories = ["visualization", "graphics"]

[dependencies]
plotters-excalidraw = { path = "../plotters-excalidraw", version = "0.1.0" }

chrono = { version = "0.4", default-features = false, features = ["std"] }
plotters = { workspace = true }
plotters-backend = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
