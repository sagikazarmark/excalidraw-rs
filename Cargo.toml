[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sagikazarmark/excaliplot"

[workspace.dependencies]
plotters = { version = "=0.3.7", default-features = false, features = ["line_series", "area_series", "datetime"] }
plotters-backend = "=0.3.7"
serde_json = "1"
tempfile = "3"

[workspace.metadata.release]
sign-commit = true
sign-tag = true
shared-version = true
tag-message = "Release {{version}}"
tag-name = "v{{version}}"

[[workspace.metadata.dagger.modules]]
name = "rust"
hack.check = ["--locked", "--each-feature"]
# Tests run with every feature enabled. The default build of `excalidraw-api` is
# `default = []`, so a plain `cargo test` compiles none of its HTTP client and
# `tests/live_experiments.rs` (gated on `blocking`) expands to nothing. Feature
# isolation is already covered by `hack.check --each-feature` above; this line
# exists so the feature-gated code is executed, not merely type-checked.
#
# The features are listed one by one instead of `--all-features`: cargo-hack
# owns `--features`, but forwards a flag it does not know to the position
# *before* the subcommand (`cargo --all-features test`), where cargo rejects it.
# Keep this list in sync when a crate gains a feature; `blocking` and `retry`
# pull in `client`, `client-core` and `provider-ring` transitively.
hack.test = [
  "--locked",
  "--features",
  "excalidraw-api/blocking,excalidraw-api/retry,excalidraw-document/embedded",
  "--workspace-behavior=cargo",
]
hack.clippy = ["--locked", "--workspace-behavior=cargo"]
hack.doc = ["--locked", "--workspace-behavior=cargo"]
