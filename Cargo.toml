[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sagikazarmark/excaliplot"

[workspace.dependencies]
plotters = { version = "=0.3.7", default-features = false, features = ["line_series", "area_series", "datetime"] }
plotters-backend = "=0.3.7"
serde_json = "1"
tempfile = "3"

[workspace.metadata.release]
sign-commit = true
sign-tag = true
shared-version = true
tag-message = "Release {{version}}"
tag-name = "v{{version}}"

[[workspace.metadata.dagger.modules]]
name = "rust"
hack.check = ["--locked", "--each-feature"]
hack.test = ["--locked", "--workspace-behavior=cargo"]
hack.clippy = ["--locked", "--workspace-behavior=cargo"]
hack.doc = ["--locked", "--workspace-behavior=cargo"]
